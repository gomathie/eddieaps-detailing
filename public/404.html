<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found | Eddie APS Detailing</title>
<!--
  Served by Cloudflare Pages for any path that matches no static asset.
  Without this file Pages answers those requests with index.html at HTTP 200,
  which lets an HTML body get cached under a hashed /_nuxt/*.css URL — the
  immutable cache headers then pin it there. Styles are inline on purpose: this
  page must not depend on a build-hashed stylesheet that changes every deploy.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: #020617;
    color: #cbd5e1;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .wrap { max-width: 32rem; }
  img { height: 2.75rem; width: auto; max-width: 100%; margin-bottom: 2.5rem; }
  .code { font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #3b82f6; margin-bottom: .75rem; }
  h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 800; color: #fff; letter-spacing: -.02em; }
  p { margin: 0 0 2rem; line-height: 1.65; font-size: .975rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  a.btn {
    display: inline-block; padding: .75rem 1.5rem; border-radius: .625rem;
    font-size: .875rem; font-weight: 700; text-decoration: none; transition: background-color .2s;
  }
  .primary { background: #2563eb; color: #fff; }
  .primary:hover { background: #3b82f6; }
  .ghost { border: 1px solid #1e293b; color: #cbd5e1; }
  .ghost:hover { color: #fff; border-color: #334155; }
  .call { margin-top: 2.5rem; font-size: .8125rem; color: #64748b; }
  .call a { color: #94a3b8; text-decoration: none; }
  .call a:hover { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/logo-wordmark-dark.svg" alt="Eddie APS Detailing">
    <div class="code">Error 404</div>
    <h1>We couldn't find that page</h1>
    <p>The page you're after may have moved or no longer exists. Let's get you back to a clean start.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to Home</a>
      <a class="btn ghost" href="/services/">View Our Services</a>
      <a class="btn ghost" href="/contact/">Contact Us</a>
    </div>
    <p class="call">Need us now? Call <a href="tel:0595118973">0595118973</a> or <a href="tel:0591357411">0591357411</a></p>
  </div>
</body>
</html>
